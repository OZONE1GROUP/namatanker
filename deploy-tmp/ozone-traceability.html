function renderSearchDrop(q) {
  const results = searchEntities(q).slice(0, 8);
  if (!results.length) return `<div class="sr-empty">No matches for "${escapeHtml(q)}". Try an ID, tag, PO number or heat number.</div>`;
  const groups = {};
  results.forEach(r => (groups[r.type] = groups[r.type] || []).push(r));
  let html = '';
  Object.entries(groups).forEach(([type, items]) => {
    html += `<div class="sr-group-label">${escapeHtml(type)}</div>`;
    items.forEach(it => {
      html += `<div class="sr-item" ${nav(it.nav.view, it.nav.id, it.nav.extra)}><span class="t">${escapeHtml(it.label)}</span><span class="s">${escapeHtml(it.sub)}</span></div>`;
    });
  });
  html += `<div class="sr-more" data-search-more="1">See all results for "${escapeHtml(q)}"</div>`;
  return html;
}
function hideSearchDrop() {
  const d = document.getElementById('searchdrop');
  if (d) { d.hidden = true; d.innerHTML = ''; }
}

// ---------------------------------------------------------------- mobile sidebar
function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ---------------------------------------------------------------- event delegation
document.addEventListener('click', function (e) {
  const sidebarEl = e.target.closest('[data-sidebar]');
  if (sidebarEl) { navigateModule(sidebarEl.getAttribute('data-sidebar')); closeMobileSidebar(); hideSearchDrop(); return; }

  if (e.target.closest('#hamburger')) { toggleMobileSidebar(); return; }
  if (e.target.closest('#sidebar-overlay')) { closeMobileSidebar(); return; }

  if (e.target.closest('#notifbtn')) { navigateModule('notifications-list'); hideSearchDrop(); return; }

  const crumbEl = e.target.closest('[data-crumb]');
  if (crumbEl) { goToCrumb(parseInt(crumbEl.getAttribute('data-crumb'), 10)); return; }

  const tabEl = e.target.closest('[data-settab]');
  if (tabEl) { updateTopParams({ tab: tabEl.getAttribute('data-settab') }); return; }

  const sortEl = e.target.closest('[data-sort-key]');
  if (sortEl) {
    const key = sortEl.getAttribute('data-sort-key');
    const top = navStack[navStack.length - 1];
    const dir = (top.params.sortKey === key && top.params.sortDir === 'asc') ? 'desc' : 'asc';
    updateTopParams({ sortKey: key, sortDir: dir });
    return;
  }

  const srMore = e.target.closest('[data-search-more]');
  if (srMore) {
    const q = document.getElementById('globalsearch').value;
    hideSearchDrop();
    navigate('search-results', null, { q });
    return;
  }

  const navEl = e.target.closest('[data-nav-view]');
  if (navEl) {
    const view = navEl.getAttribute('data-nav-view');
    const id = navEl.getAttribute('data-nav-id') || null;
    const extraRaw = navEl.getAttribute('data-nav-extra');
    let extra = null;
    if (extraRaw) { try { extra = JSON.parse(extraRaw); } catch (err) { extra = null; } }
    hideSearchDrop();
    navigate(view, id, extra);
    return;
  }

  if (!e.target.closest('.searchwrap')) hideSearchDrop();
});

document.addEventListener('change', function (e) {
  const sel = e.target.closest('select[data-filter-key]');
  if (sel) updateTopParams({ [sel.getAttribute('data-filter-key')]: sel.value || undefined });
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'globalsearch') {
    const q = e.target.value;
    const drop = document.getElementById('searchdrop');
    if (!q.trim()) { drop.hidden = true; drop.innerHTML = ''; return; }
    drop.innerHTML = renderSearchDrop(q);
    drop.hidden = false;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.target.id !== 'globalsearch') return;
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value;
    hideSearchDrop();
    navigate('search-results', null, { q });
  } else if (e.key === 'Escape') {
    hideSearchDrop();
    e.target.blur();
  }
});

// ---------------------------------------------------------------- boot
(function boot() {
  document.getElementById('sidebarnav').innerHTML = renderSidebarNav();
  document.getElementById('identityslot').innerHTML = renderIdentity();
  document.getElementById('ham-ic-slot').outerHTML = icon('menu');
  document.getElementById('search-ic-slot').outerHTML = icon('search', 'searchic');
  document.getElementById('notif-ic-slot').outerHTML = icon('bell');
  render();
})();

</script>
