<title>OZONE Traceability</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OZONE Manufacturing & Traceability Platform — UI simulator styles */
/* Layout concept: fixed-width industrial sidebar (persistent nav) + sticky
   top bar (search, alerts, identity) + scrolling content column with a
   breadcrumb rail; detail pages use tab strips and a left-rule timeline
   for stage/revision history so depth reads as depth, not just more table. */
:root {
  /* color */
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e4e9ee;
  --border: #d2dae1;
  --ink: #101b26;
  --muted: #5b6b78;
  --faint: #8695a1;
  --sidebar-bg: #0b2545;
  --sidebar-bg-2: #0e2d53;
  --sidebar-fg: #d9e4ee;
  --sidebar-fg-dim: #93a8bd;
  --sidebar-active: #123a63;
  --accent: #0f8f84;
  --accent-ink: #ffffff;
  --accent-weak: #e1f2ef;
  --good: #1f8f5f;
  --good-weak: #e4f5ec;
  --warn: #ad7418;
  --warn-weak: #fbf0dc;
  --bad: #bb3b34;
  --bad-weak: #fbe8e6;
  --hold: #7c4aa8;
  --hold-weak: #f1e8f8;
  --info: #2b6cb0;
  --info-weak: #e6eefa;
  /* type */
  --font-display: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a141f; --surface: #101c29; --surface-2: #16263750; --border: #253a4d;
    --ink: #e6edf3; --muted: #93a7b8; --faint: #6c8192;
    --sidebar-bg: #071523; --sidebar-bg-2: #0a1c30; --sidebar-fg: #d9e4ee; --sidebar-fg-dim: #7f97ab; --sidebar-active: #102c47;
    --accent: #2bbdae; --accent-ink: #052521; --accent-weak: #0f2d2b;
    --good: #3fbe82; --good-weak: #0f2a1f; --warn: #e0a83e; --warn-weak: #2e2410;
    --bad: #e2655f; --bad-weak: #341614; --hold: #b98ae0; --hold-weak: #261a33;
    --info: #6fa8dc; --info-weak: #132234;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a141f; --surface: #101c29; --surface-2: #16263750; --border: #253a4d;
  --ink: #e6edf3; --muted: #93a7b8; --faint: #6c8192;
  --sidebar-bg: #071523; --sidebar-bg-2: #0a1c30; --sidebar-fg: #d9e4ee; --sidebar-fg-dim: #7f97ab; --sidebar-active: #102c47;
  --accent: #2bbdae; --accent-ink: #052521; --accent-weak: #0f2d2b;
  --good: #3fbe82; --good-weak: #0f2a1f; --warn: #e0a83e; --warn-weak: #2e2410;
  --bad: #e2655f; --bad-weak: #341614; --hold: #b98ae0; --hold-weak: #261a33;
  --info: #6fa8dc; --info-weak: #132234;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font-family: inherit; }

/* ---------- App shell ---------- */
#app { display: flex; min-height: 100%; }

#sidebar {
  width: 236px; flex: 0 0 236px; background: var(--sidebar-bg); color: var(--sidebar-fg);
  position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; z-index: 20;
  transition: transform .2s ease;
}
#sidebar .brand {
  display: flex; align-items: center; gap: 10px; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#sidebar .brand .mark {
  width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; flex: none;
}
#sidebar .brand .name { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.2; }
#sidebar .brand .sub { font-size: 10.5px; color: var(--sidebar-fg-dim); letter-spacing: .03em; }
#sidebar nav { padding: 10px max(10px, env(safe-area-inset-right, 0px)) 16px max(10px, env(safe-area-inset-left, 0px)); flex: 1; }
#sidebar .navgroup-label { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--sidebar-fg-dim); padding: 14px 10px 6px; }
.navitem {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px;
  color: var(--sidebar-fg-dim); font-size: 13.2px; cursor: pointer; margin-bottom: 1px; font-weight: 500;
}
.navitem .ic { width: 17px; height: 17px; flex: none; opacity: .9; }
.navitem:hover { background: rgba(255,255,255,0.06); color: var(--sidebar-fg); }
.navitem.active { background: var(--sidebar-active); color: #fff; }
.navitem .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: rgba(255,255,255,0.12); padding: 1px 6px; border-radius: 20px; }
.navitem.active .cnt { background: var(--accent); color: var(--accent-ink); }
#sidebar .foot { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: var(--sidebar-fg-dim); }
#sidebar .foot b { color: var(--sidebar-fg); }

#sidebar-overlay { display: none; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

#topbar {
  position: sticky; top: 0; z-index: 15; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); min-height: 54px;
}
#hamburger { display: none; background: none; border: 1px solid var(--border); border-radius: 7px; width: 34px; height: 34px; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; flex: none; }
#hamburger svg { width: 18px; height: 18px; }

.searchwrap { position: relative; flex: 1; max-width: 480px; }
#globalsearch {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink); font-size: 13.2px; font-family: var(--font-body);
}
#globalsearch:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.searchwrap svg.searchic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
#searchdrop {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 10px 28px rgba(10,20,30,0.18); max-height: 420px; overflow-y: auto; z-index: 30;
}
#searchdrop .sr-group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 9px 12px 4px; }
#searchdrop .sr-item { display: flex; flex-direction: column; gap: 1px; padding: 7px 12px; cursor: pointer; border-top: 1px solid var(--border); }
#searchdrop .sr-item:first-child { border-top: none; }
#searchdrop .sr-item:hover { background: var(--surface-2); }
#searchdrop .sr-item .t { font-family: var(--font-mono); font-size: 12.3px; font-weight: 600; }
#searchdrop .sr-item .s { font-size: 11.5px; color: var(--muted); }
#searchdrop .sr-empty { padding: 16px; color: var(--muted); font-size: 12.5px; text-align: center; }
#searchdrop .sr-more { padding: 8px 12px; font-size: 11.5px; color: var(--accent); text-align: center; border-top: 1px solid var(--border); cursor: pointer; }

.topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.pill.demo { background: var(--warn-weak); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.iconbtn { position: relative; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 17px; height: 17px; }
.iconbtn .dot { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 20px; background: var(--bad); color: #fff; font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }
.identity { display: flex; align-items: center; gap: 8px; padding-left: 8px; border-left: 1px solid var(--border); margin-left: 2px; cursor: default; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; flex: none; }
.identity .who { line-height: 1.2; }
.identity .who .nm { font-size: 12.3px; font-weight: 600; }
.identity .who .rl { font-size: 10.5px; color: var(--muted); }
.identity .who { display: none; }
@media (min-width: 760px) { .identity .who { display: block; } }

#breadbar { padding: 11px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.breadcrumb .bc-item { cursor: pointer; }
.breadcrumb .bc-item:hover { color: var(--accent); text-decoration: underline; }
.breadcrumb .bc-sep { color: var(--faint); }
.breadcrumb .bc-item.current { color: var(--ink); font-weight: 600; cursor: default; }
.breadcrumb .bc-item.current:hover { text-decoration: none; }

#viewport { flex: 1; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)); max-width: 1320px; width: 100%; }

/* ---------- Primitives ---------- */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 6px 0 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; }
.page-head .lede { color: var(--muted); font-size: 12.8px; margin-top: 3px; max-width: 62ch; }
.page-head .headmeta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 7px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.card-pad { padding: 16px; }
.grid { display: grid; gap: 12px; }
.grid-kpi { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid-charts { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

.kpi { padding: 14px 15px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .kv { font-family: var(--font-display); font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .kl { font-size: 11.3px; color: var(--muted); font-weight: 600; }
.kpi .kc { font-size: 10.5px; color: var(--faint); }
.kpi.flag-bad .kv { color: var(--bad); }
.kpi.flag-warn .kv { color: var(--warn); }
.kpi.flag-good .kv { color: var(--good); }

.section-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.section-title .hint { font-size: 11px; color: var(--faint); font-weight: 500; }

.chart-card { padding: 14px 16px 10px; }
.chart-card .ct { font-family: var(--font-display); font-weight: 700; font-size: 12.6px; margin-bottom: 2px; }
.chart-card .cd { font-size: 11px; color: var(--faint); margin-bottom: 8px; }
svg.chart text { fill: var(--muted); font-family: var(--font-body); }
svg.chart .gridline { stroke: var(--border); stroke-width: 1; }
svg.chart .barfill { fill: var(--accent); }
svg.chart .barfill.b2 { fill: var(--hold); }
svg.chart .valuelabel { fill: var(--ink); font-weight: 600; font-family: var(--font-mono); }

table.dtable { width: 100%; border-collapse: collapse; font-size: 12.8px; }
table.dtable th { text-align: left; font-size: 10.6px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.dtable th.sortable { cursor: pointer; user-select: none; }
table.dtable th.sortable:hover { color: var(--accent); }
table.dtable td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.dtable tbody tr.clickable { cursor: pointer; }
table.dtable tbody tr.clickable:hover { background: var(--surface-2); }
table.dtable tbody tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; }
.table-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12.8px; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.8px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; line-height: 1.5; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge.b-good { background: var(--good-weak); color: var(--good); }
.badge.b-warn { background: var(--warn-weak); color: var(--warn); }
.badge.b-bad { background: var(--bad-weak); color: var(--bad); }
.badge.b-hold { background: var(--hold-weak); color: var(--hold); }
.badge.b-info { background: var(--info-weak); color: var(--info); }
.badge.b-muted { background: var(--surface-2); color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters select, .filters input[type=search] {
  font-family: var(--font-body); font-size: 12.3px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink);
}
.filters .fcount { font-size: 11.5px; color: var(--faint); margin-left: auto; }

.tabstrip { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 4px 0 16px; overflow-x: auto; }
.tabstrip .tab { padding: 9px 13px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabstrip .tab:hover { color: var(--ink); }
.tabstrip .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabstrip .tab .tc { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); margin-left: 4px; }

.detail-grid { display: grid; grid-template-columns: 2.1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 880px) { .detail-grid { grid-template-columns: 1fr; } }

.kv-list { display: grid; grid-template-columns: 1fr; gap: 0; }
.kv-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 12.6px; }
.kv-row:last-child { border-bottom: none; }
.kv-row .k { color: var(--muted); }
.kv-row .v { font-weight: 600; text-align: right; }
.kv-row .v.mono { font-weight: 500; }

.link { color: var(--accent); cursor: pointer; font-weight: 600; }
.link:hover { text-decoration: underline; }
.linkline { display: flex; align-items: center; gap: 6px; }

.stepper { display: flex; flex-wrap: wrap; gap: 0; margin: 4px 0 2px; }
.stepper .step { display: flex; align-items: center; gap: 6px; font-size: 11.3px; padding: 6px 12px 6px 0; color: var(--faint); font-weight: 600; }
.stepper .step .sdot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--faint); flex: none; }
.stepper .step.done { color: var(--good); } .stepper .step.done .sdot { background: var(--good); border-color: var(--good); }
.stepper .step.now { color: var(--accent); } .stepper .step.now .sdot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.stepper .step:not(:last-child)::after { content: ''; width: 18px; height: 1px; background: var(--border); margin-left: 8px; }

.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 18px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item .tl-dot { position: absolute; left: -26px; top: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); display: flex; align-items: center; justify-content: center; }
.tl-item .tl-dot svg { width: 9px; height: 9px; }
.tl-item.done .tl-dot { border-color: var(--good); background: var(--good-weak); color: var(--good); }
.tl-item.current .tl-dot { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-weak); }
.tl-item.blocked .tl-dot { border-color: var(--bad); background: var(--bad-weak); color: var(--bad); }
.tl-item.skipped .tl-dot { border-color: var(--faint); background: var(--surface-2); color: var(--faint); }
.tl-item.pending .tl-dot { border-color: var(--border); }
.tl-item .tl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tl-item .tl-name { font-weight: 700; font-size: 12.8px; }
.tl-item.pending .tl-name { color: var(--faint); font-weight: 600; }
.tl-item .tl-when { font-size: 11px; color: var(--faint); font-family: var(--font-mono); }
.tl-item .tl-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-item .tl-note.warn-note { color: var(--bad); }
.tl-item .tl-actor { font-size: 11px; color: var(--faint); margin-top: 2px; }

.doclist-row, .relrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.6px; cursor: pointer; }
.doclist-row:last-child, .relrow:last-child { border-bottom: none; }
.doclist-row:hover, .relrow:hover { background: var(--surface-2); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 6px; }
.doclist-row .main .t { font-weight: 600; } .doclist-row .main .s { font-size: 11px; color: var(--muted); }

.qr-box { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; }
.qr-box svg { border-radius: 8px; }
.qr-cap { font-size: 10.2px; color: var(--faint); text-align: center; line-height: 1.4; }
.qr-id { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty h3 { font-size: 15px; margin-bottom: 6px; color: var(--ink); }
.empty p { font-size: 12.8px; max-width: 40ch; margin: 0 auto; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 10px; font-size: 12.3px; margin-bottom: 16px; border: 1px solid; }
.banner.info { background: var(--info-weak); color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.banner.warn { background: var(--warn-weak); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.banner b { color: var(--ink); }

.notif-item { display: flex; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif-item:hover { background: var(--surface-2); }
.notif-item .nsev { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
.notif-item .nsev.critical { background: var(--bad); } .notif-item .nsev.warning { background: var(--warn); } .notif-item .nsev.info { background: var(--info); }
.notif-item .ncat { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 700; }
.notif-item .ntxt { font-size: 12.6px; margin-top: 1px; }
.notif-item .ntime { font-size: 11px; color: var(--faint); margin-left: auto; white-space: nowrap; }

.statusgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.statusrow { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 12.3px; }

.progress-bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }

.dossier-item { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  };

function buildStageTimeline(startTs, outcome, category) {
  const stages = STAGE_DEFS.map((name, idx) => ({ idx, name, status: 'pending', date: null, actor: null, note: null }));
  const skipPressureTest = category === 'Piping Spool' && chance(0.5);
  let doneThrough; // inclusive index of last fully done stage
  let blockedAt = null, blockedReason = null;
  let cursor = startTs;

  const actorsCycle = ['U03', 'U13', 'U10', 'U04', 'U02', 'U06', 'U09'];
  function stepDate(days) { cursor = addDays(cursor, days); return cursor; }

  switch (outcome) {
    case 'complete': doneThrough = 21; break;
    case 'awaiting-dispatch': doneThrough = 16; break;
    case 'blocked-approval': doneThrough = 1; blockedAt = 2; blockedReason = 'Engineering drawing under Revise & Resubmit — welding cannot start until Rev B is approved.'; break;
    case 'material-shortage': doneThrough = 3; blockedAt = 4; blockedReason = 'Supplier delivery of SA-516 Gr.70 plate overdue — production on hold pending goods receipt.'; break;
    case 'ncr-hold': doneThrough = 11; blockedAt = 12; blockedReason = 'NDT indication under disposition review — item on quality hold pending NCR closure.'; break;
    default: doneThrough = Math.min(20, Math.max(2, Math.round(rf() * 20)));
  }

  for (let i = 0; i < stages.length; i++) {
    if (skipPressureTest && i === 14) {
      stages[i].status = 'skipped';
      stages[i].note = 'Not applicable — piping spool qualified by pneumatic leak test recorded under NDT & Inspections Completed.';
      stages[i].actor = 'U04';
      continue;
    }
    if (i <= doneThrough) {
      stages[i].status = 'done';
      stepDate(ri(1, 6));
      stages[i].date = cursor;
      stages[i].actor = pick(actorsCycle);
    } else if (blockedAt === i) {
      stages[i].status = 'blocked';
      stages[i].note = blockedReason;
      stages[i].actor = pick(actorsCycle);
    }
  }
  if (!blockedAt && doneThrough < 21) {
    stages[Math.min(doneThrough + 1, 21)].status = 'current';
  }
  const lastDoneDate = stages.filter(s => s.date).map(s => s.date).pop() || startTs;
  return { stages, doneThrough, blockedAt, lastDoneDate, skipPressureTest };
}

function qrPattern(seedStr) {
  // Deterministic 11x11 pixel pattern (demo only — not a scannable code)
  let h = 0; for (let i = 0; i < seedStr.length; i++) h = (h * 31 + seedStr.charCodeAt(i)) >>> 0;
  const localRng = mulberry32(h);
  const cells = [];
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    const corner = (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
    cells.push(corner ? 1 : (localRng() < 0.46 ? 1 : 0));
  }
  return cells;
}

// Build equipment records from PO lines, plus their docs, materials, inspections
let eqGlobalIndex = 0;
const forcedSequence = ['blocked-approval', 'material-shortage', 'ncr-hold', 'awaiting-dispatch', 'complete'];
for (const cpo of CUSTOMER_POS) {
  const proj = projById[cpo.projectId];
  for (const line of cpo.lines) {
    for (const eqId of line.equipmentIds) {
      eqGlobalIndex++;
      let outcome;
      if (proj.status === 'Closed') outcome = 'complete';
      else if (proj.status === 'On Hold') outcome = 'blocked-approval';
      else if (eqGlobalIndex <= forcedSequence.length) outcome = forcedSequence[eqGlobalIndex - 1];
      else outcome = 'normal';

      // Equipment demonstrating a *current* blocker gets a recent start date
      // (a few weeks ago) so the hold reads as live, not an 18-month-old stall.
      const isCurrentBlocker = outcome === 'blocked-approval' || outcome === 'material-shortage' || outcome === 'ncr-hold';
      const startTs = isCurrentBlocker ? addDays(NOW, -ri(60, 110)) : addDays(cpo.issueDate, ri(3, 10));
      const tl = buildStageTimeline(startTs, outcome, line.category);
      const serial = `STS/${new Date(startTs).getUTCFullYear()}/${pad(eqGlobalIndex, 4)}`;
      const qualityHold = tl.blockedAt !== null && outcome === 'ncr-hold';
      const dispatchStatus = outcome === 'complete' ? 'Delivered'
        : (tl.doneThrough >= 19) ? 'Dispatched'
        : (tl.doneThrough >= 16) ? 'Ready for Dispatch' : 'Not Ready';

      const eq = {
        id: eqId, projectId: proj.id, poId: cpo.id, lineNo: line.lineNo, tag: line.tag + (line.qty > 1 ? `-${pad(line.equipmentIds.indexOf(eqId) + 1, 2)}` : ''),
        serial, desc: line.desc, category: line.category, drawingRef: line.drawingRef, drawingRev: pick(['A', 'B', 'C']),
        material: null, facility: line.facility,
        plannedStart: startTs, plannedFinish: addDays(startTs, 90),
        actualStart: startTs, actualFinish: tl.doneThrough >= 21 ? tl.lastDoneDate : null,
        owner: pick(['U03', 'U13', 'U10']),
        stages: tl.stages, currentStageIdx: tl.blockedAt !== null ? tl.blockedAt : Math.min(tl.doneThrough + 1, 21),
        qualityHold, dispatchStatus,
        plannedDispatch: addDays(line.requiredDate, -7),
        actualDispatch: dispatchStatus === 'Dispatched' || dispatchStatus === 'Delivered' ? tl.lastDoneDate : null,
        outcome,
      };
      EQUIPMENT.push(eq);
      logAudit('Equipment', eqId, eq.tag, 'Equipment record created', 'U01', startTs, `Linked to ${cpo.poNumber} line ${line.lineNo}.`);
      for (const s of tl.stages) {
        if (s.status === 'done') logAudit('Equipment', eqId, eq.tag, `Stage completed: ${s.name}`, s.actor, s.date, s.note || '');
        if (s.status === 'blocked') logAudit('Equipment', eqId, eq.tag, `Stage blocked: ${s.name}`, s.actor, NOW - DAY * ri(1, 10), s.note || '');
        if (s.status === 'skipped') logAudit('Equipment', eqId, eq.tag, `Stage skipped: ${s.name}`, s.actor, addDays(startTs, 40), s.note || '');
      }

      // ---- Documents for this equipment ----
      const docPool = ['Engineering Drawing', 'Material Test Certificate', 'Welding Procedure Specification', 'NDT Report', 'Dimensional Inspection Report'];
      const docCount = ri(2, 3);
      const chosenDocs = pickN(docPool, docCount);
      const linkedDocIds = [];
      for (const dtName of chosenDocs) {
        const docId = newDocId();
        const disc = DOC_DISCIPLINE[dtName];
        const docNumber = `STS-${proj.code}-${disc}-${pad(docSeq, 4)}`;
        // Pick a terminal path so the register shows the full range of document
        // states, not only fully-approved documents.
        const roll = rf();
        const path = outcome === 'blocked-approval' && dtName === 'Engineering Drawing' ? 'pending-resubmit'
          : roll < 0.52 ? 'approved'
          : roll < 0.68 ? 'rejected-then-approved'
          : roll < 0.80 ? 'pending-resubmit'
          : roll < 0.90 ? 'under-review'
          : 'in-review';
        let revCode = 'A';
        const history = [];
        let t = addDays(startTs, ri(-10, 10));
        const originator = pick(['U02', 'U08', 'U11']);
        history.push({ event: 'Revision created', rev: revCode, from: null, to: 'Draft', actor: originator, ts: t });
        t = addDays(t, ri(1, 3));
        history.push({ event: 'Internal review', rev: revCode, from: 'Draft', to: 'Internal Review', actor: 'U11', ts: t });
        let finalStatus = 'Internal Review';
        let dueDate = addDays(t, ri(7, 14));
        if (path !== 'in-review') {
          t = addDays(t, ri(1, 2));
          history.push({ event: 'Approved for submission', rev: revCode, from: 'Internal Review', to: 'Approved for Submission', actor: 'U08', ts: t });
          t = addDays(t, 1);
          const transId = newTransId(proj.code);
          history.push({ event: 'Submitted via transmittal', rev: revCode, from: 'Approved for Submission', to: 'Submitted', actor: 'U02', ts: t, transmittal: transId });
          finalStatus = 'Submitted';
          dueDate = addDays(t, 14);
          if (path !== 'under-review') {
            t = addDays(t, ri(5, 12));
            if (path === 'approved') {
              history.push({ event: 'Customer review', rev: revCode, from: 'Submitted', to: 'Approved', actor: 'U08', ts: t });
              finalStatus = 'Approved';
            } else {
              history.push({ event: 'Customer review', rev: revCode, from: 'Submitted', to: 'Revise & Resubmit', actor: 'U08', ts: t, comment: 'Dimensional tolerance callout requires clarification on Detail C.' });
              finalStatus = 'Revise & Resubmit';
              dueDate = addDays(t, 10);
              if (path === 'rejected-then-approved') {
                revCode = 'B';
                t = addDays(t, ri(3, 6));
                history.push({ event: 'Revision created', rev: revCode, from: 'Revise & Resubmit', to: 'Draft', actor: originator, ts: t, comment: 'Superseding Rev A per customer comment.' });
                t = addDays(t, 2);
                history.push({ event: 'Internal review', rev: revCode, from: 'Draft', to: 'Internal Review', actor: 'U11', ts: t });
                t = addDays(t, 1);
                history.push({ event: 'Approved for submission', rev: revCode, from: 'Internal Review', to: 'Approved for Submission', actor: 'U08', ts: t });
                t = addDays(t, 1);
                const transId2 = newTransId(proj.code);
                history.push({ event: 'Resubmitted via transmittal', rev: revCode, from: 'Approved for Submission', to: 'Submitted', actor: 'U02', ts: t, transmittal: transId2 });
                t = addDays(t, ri(4, 9));
                history.push({ event: 'Customer review', rev: revCode, from: 'Submitted', to: 'Approved', actor: 'U08', ts: t });
                finalStatus = 'Approved';
                dueDate = addDays(t, 14);
              }
            }
          }
        }
        const doc = {
          id: docId, docNumber, title: `${dtName} — ${eq.tag}`, type: dtName, projectId: proj.id,
          poId: cpo.id, lineNo: line.lineNo, equipmentId: eqId, originator, controller: 'U02',
          revision: revCode, status: finalStatus, history,
          dueDate, confidentiality: 'Internal — Controlled',
        };
        DOCUMENTS.push(doc);
        linkedDocIds.push(docId);
        for (const h of history) {
          logAudit('Document', docId, docNumber, h.event, h.actor, h.ts, h.comment || (h.transmittal ? `Transmittal ${h.transmittal}` : ''), h.from, h.to);
        }
      }
      eq.documentIds = linkedDocIds;

      // ---- Material batch + genealogy ----
      if (tl.doneThrough >= 4) {
        const matId = newMatId();
        const heat = 'HT' + ri(400000, 499999);
        const batchNo = 'B-' + ri(2000, 9999);
        const supplier = pick(SUPPLIERS);
        const certOk = chance(0.85);
        const recvDate = addDays(startTs, ri(5, 12));
        const qty = ri(2, 12);
        const batch = {
          id: matId, heat, batchNo, grade: line.material || catalogueGrade(line), supplier: supplier.id,
          projectId: proj.id, poId: null, receivedDate: recvDate, qtyReceived: qty, qtyConsumed: qty,
          qtyRemaining: 0, certStatus: certOk ? 'Verified' : 'Pending Verification', storageLocation: `${proj.facility.split(' ')[1] || 'Yard'} — Rack ${ri(1,9)}${pick(['A','B','C'])}`,
          usage: [{ equipmentId: eqId, qty, weldRef: `W-${pad(eqGlobalIndex,3)}-${ri(1,9)}` }],
        };
        MATERIAL_BATCHES.push(batch);
        logAudit('Material Batch', matId, `Heat ${heat}`, 'Goods received', 'U06', recvDate, `${qty} units from ${supplier.name}.`);
        if (certOk) logAudit('Material Batch', matId, `Heat ${heat}`, 'Material certificate verified', 'U06', addDays(recvDate, 1), `MTC verified against ${line.material || catalogueGrade(line)} specification.`);
        logAudit('Material Batch', matId, `Heat ${heat}`, 'Issued to production', 'U06', addDays(recvDate, 2), `${qty} units issued against ${eq.tag}.`);
        eq.materialBatchIds = [matId];
      } else {
        eq.materialBatchIds = [];
      }

      // ---- Inspections ----
      const inspTypes = [];
      if (tl.doneThrough >= 10) inspTypes.push('Welding Inspection');
      if (tl.doneThrough >= 12 || outcome === 'ncr-hold') inspTypes.push('NDT — Radiographic');
      if (tl.doneThrough >= 13) inspTypes.push('Dimensional Inspection');
      if (tl.doneThrough >= 15 && !tl.skipPressureTest) inspTypes.push('Hydrostatic Pressure Test');
      if (tl.doneThrough >= 16) inspTypes.push('Final Inspection');
      const inspStageIdx = { 'Welding Inspection': 10, 'NDT — Radiographic': 12, 'Dimensional Inspection': 13, 'Hydrostatic Pressure Test': 14, 'Final Inspection': 15 };
      const inspIds = [];
      for (const itype of inspTypes) {
        const forcedFail = outcome === 'ncr-hold' && itype === 'NDT — Radiographic';
        const result = forcedFail ? 'Fail' : (chance(0.92) ? 'Pass' : 'Fail');
        const iid = newInspId();
        // Anchor the inspection to when its stage actually completed (or, for
        // the stage currently blocked pending disposition, to just before now).
        const sDate = tl.stages[inspStageIdx[itype]] && tl.stages[inspStageIdx[itype]].date;
        const actDate = Math.min(sDate || addDays(NOW, -ri(5, 15)), addDays(NOW, -1));
        const reqDate = addDays(actDate, -ri(1, 4));
        const insp = {
          id: iid, equipmentId: eqId, projectId: proj.id, type: itype,
          acceptanceCriteria: itype.includes('NDT') ? 'ASME IX / client ITP Rev.1 acceptance limits' : itype.includes('Hydro') ? '1.5x design pressure, 30 min hold, per ITP' : 'Approved ITP acceptance criteria',
          requestDate: reqDate, plannedDate: addDays(reqDate, 1), actualDate: actDate,
          inspector: 'U04', witness: chance(0.4) ? 'Third-Party TPI' : null,
          result, observations: result === 'Fail' ? 'Linear indication exceeding acceptance length at weld seam W-' + pad(eqGlobalIndex, 3) + '-2.' : 'No indications beyond acceptance criteria.',
          ncrId: null,
        };
        INSPECTIONS.push(insp);
        inspIds.push(iid);
        logAudit('Inspection', iid, itype, 'Inspection requested', 'U03', reqDate, `Requested for ${eq.tag}.`);
        logAudit('Inspection', iid, itype, `Inspection result: ${result}`, 'U04', actDate, insp.observations);
      }
      eq.inspectionIds = inspIds;

      // ---- NCR ----
      eq.ncrId = null;
      const failedInsp = INSPECTIONS.find(i => i.equipmentId === eqId && i.result === 'Fail');
      if (failedInsp) {
        const ncrId = newNcrId();
        const detect = failedInsp.actualDate;
        const isOpen = outcome === 'ncr-hold';
        const closeTarget = addDays(detect, 21);
        const ncr = {
          id: ncrId, projectId: proj.id, equipmentId: eqId, documentRef: null, materialRef: null,
          description: failedInsp.observations, detectDate: detect, dept: 'Quality',
          severity: pick(['Major', 'Minor']), status: isOpen ? 'Disposition Review' : 'Closed',
          containment: 'Weld seam flagged and quarantined pending disposition.',
          disposition: isOpen ? null : 'Repair by re-weld and re-NDT per approved WPS.',
          rootCause: isOpen ? null : 'Localized porosity due to inconsistent shielding gas flow.',
          correctiveAction: isOpen ? null : 'Gas flow meter recalibrated on welding bay 2; welder re-briefed.',
          responsible: 'U07', targetClosure: closeTarget,
          actualClosure: isOpen ? null : addDays(detect, ri(10, 18)),
        };
        NCRS.push(ncr);
        failedInsp.ncrId = ncrId;
        eq.ncrId = ncrId;
        logAudit('NCR', ncrId, ncrId, 'NCR raised', 'U04', detect, ncr.description);
        if (!isOpen) {
          logAudit('NCR', ncrId, ncrId, 'Disposition approved', 'U07', addDays(detect, 3), ncr.disposition);
          logAudit('NCR', ncrId, ncrId, 'Reinspection passed', 'U04', addDays(detect, ri(8,14)), 'Re-NDT clear. Item released from hold.');
          logAudit('NCR', ncrId, ncrId, 'NCR closed', 'U07', ncr.actualClosure, 'Closure review complete.');
        } else {
          logAudit('NCR', ncrId, ncrId, 'Containment recorded', 'U04', addDays(detect, 1), ncr.containment);
        }
      }

      // ---- Dispatch ----
      if (dispatchStatus === 'Dispatched' || dispatchStatus === 'Delivered') {
        const did = newDispId();
        const dDate = eq.actualDispatch || tl.lastDoneDate;
        DISPATCH_RECORDS.push({
          id: did, equipmentId: eqId, projectId: proj.id, dispatchDate: dDate,
          deliveryRef: `DN-${proj.code}-${pad(ri(100,999),3)}`,

        });
        logAudit('Dispatch', did, eq.tag, 'Dispatch authorized', 'U09', addDays(dDate,-1), 'Quality release confirmed prior to dispatch.');
        logAudit('Dispatch', did, eq.tag, 'Shipment dispatched', 'U09', dDate, `Delivery note ${`DN-${proj.code}`} issued.`);
        if (dispatchStatus === 'Delivered') logAudit('Dispatch', did, eq.tag, 'Delivery acknowledgement received', 'U09', addDays(dDate, ri(3,7)), 'Signed delivery note received from customer.');
      }
    }
  }
}
function catalogueGrade(line) { return line.material || 'SA-516 Gr.70'; }

// ---------- Resolve stale in-progress documents ----------
// A live system wouldn't leave a document hanging unresolved for well over a
// year with nobody acting on it. Anything last touched more than ~60 days
// before "now" is carried forward to a resolved state; only documents whose
// most recent activity is genuinely recent are left open, so the dashboard's
// "overdue" counters reflect current work rather than historical backlog.
const STALE_DAYS = 60;
const currentlyBlockedEquipIds = new Set(EQUIPMENT.filter(e => e.stages.some(s => s.status === 'blocked')).map(e => e.id));
for (const doc of DOCUMENTS) {
  if (doc.status === 'Approved') continue;
  if (currentlyBlockedEquipIds.has(doc.equipmentId)) continue; // keep the live blocker's own paperwork open
  let last = doc.history[doc.history.length - 1];
  if ((NOW - last.ts) / DAY <= STALE_DAYS) continue;
  const before = doc.history.length;
  let t = last.ts;
  if (doc.status === 'Internal Review') {
    t = addDays(t, ri(1, 2));
    doc.history.push({ event: 'Approved for submission', rev: doc.revision, from: 'Internal Review', to: 'Approved for Submission', actor: 'U08', ts: t });
    t = addDays(t, 1);
    const tid = newTransId(projById[doc.projectId].code);
    doc.history.push({ event: 'Submitted via transmittal', rev: doc.revision, from: 'Approved for Submission', to: 'Submitted', actor: 'U02', ts: t, transmittal: tid });
    doc.status = 'Submitted';
    t = addDays(t, ri(5, 10));
  }
  if (doc.status === 'Submitted') {
    doc.history.push({ event: 'Customer review', rev: doc.revision, from: 'Submitted', to: 'Approved', actor: 'U08', ts: t });
    doc.status = 'Approved';
    doc.dueDate = addDays(t, 14);
  } else if (doc.status === 'Revise & Resubmit') {
    const rc = String.fromCharCode(doc.revision.charCodeAt(0) + 1);
    t = addDays(t, ri(3, 6));
    doc.history.push({ event: 'Revision created', rev: rc, from: 'Revise & Resubmit', to: 'Draft', actor: doc.originator, ts: t, comment: 'Superseding prior revision per customer comment.' });
    t = addDays(t, 2);
    doc.history.push({ event: 'Internal review', rev: rc, from: 'Draft', to: 'Internal Review', actor: 'U11', ts: t });
    t = addDays(t, 1);
    doc.history.push({ event: 'Approved for submission', rev: rc, from: 'Internal Review', to: 'Approved for Submission', actor: 'U08', ts: t });
    t = addDays(t, 1);
    const tid2 = newTransId(projById[doc.projectId].code);
    doc.history.push({ event: 'Resubmitted via transmittal', rev: rc, from: 'Approved for Submission', to: 'Submitted', actor: 'U02', ts: t, transmittal: tid2 });
    t = addDays(t, ri(4, 9));
    doc.history.push({ event: 'Customer review', rev: rc, from: 'Submitted', to: 'Approved', actor: 'U08', ts: t });
    doc.revision = rc;
    doc.status = 'Approved';
    doc.dueDate = addDays(t, 14);
  }
  for (let i = before; i < doc.history.length; i++) {
    const h = doc.history[i];
    logAudit('Document', doc.id, doc.docNumber, h.event, h.actor, h.ts, h.comment || (h.transmittal ? `Transmittal ${h.transmittal}` : ''), h.from, h.to);
  }
}

    if (isLate) logAudit('Procurement PO', ppoId, ppoNumber, 'Delivery date revised', 'U12', addDays(promised,-2), `Promised date revised to ${dstr(ppo.revisedPromisedDate)} — supplier capacity constraint.`, dstr(promised), dstr(ppo.revisedPromisedDate));
    if (received > 0) logAudit('Procurement PO', ppoId, ppoNumber, 'Goods receipt recorded', 'U06', actual || addDays(promised, 2), `${received} of ${qty} ${ppo.unit} received.`);
  }
}

// ---------- Resolve stale procurement POs ----------
// An unreceived PO whose promised date is long past would have been
// expedited or escalated by now. Keep only a small, recent set of genuinely
// overdue POs so the supplier-performance KPIs stay realistic rather than
// showing a year-long unresolved backlog.
{
  let keptOverdue = 0;
  const KEEP_OVERDUE_MAX = 3;
  for (const ppo of PROCUREMENT_POS) {
    if (ppo.status === 'Closed' || ppo.actualDeliveryDate) continue;
    const due = ppo.revisedPromisedDate || ppo.promisedDate;
    if ((NOW - due) / DAY <= 45) continue; // not stale yet
    if (keptOverdue < KEEP_OVERDUE_MAX && chance(0.5)) { keptOverdue++; continue; }
    const deliveredTs = addDays(due, ri(-3, 12));
    ppo.actualDeliveryDate = deliveredTs;
    ppo.qtyReceived = ppo.qty;
    ppo.qtyBalance = 0;
    ppo.status = 'Material Release';
    logAudit('Procurement PO', ppo.id, ppo.poNumber, 'Goods receipt recorded', 'U06', deliveredTs, `${ppo.qty} of ${ppo.qty} ${ppo.unit} received — PO closed out.`);
    logAudit('Procurement PO', ppo.id, ppo.poNumber, 'Material released to production', 'U06', addDays(deliveredTs, 1), `Certificates verified; material released against ${proj_code_for(ppo.projectId)}.`);
  }
}

// Reconstruct a transmittal register from document history events that reference a transmittal id.
const transMap = new Map();
for (const doc of DOCUMENTS) {
  for (const h of doc.history) {
    if (h.transmittal) {
      if (!transMap.has(h.transmittal)) {
        transMap.set(h.transmittal, {
          id: h.transmittal, projectId: doc.projectId, sentDate: h.ts, sender: 'STS Group — OZONE Document Control',
          recipient: custById[projById[doc.projectId].customerId].name, purpose: h.event.includes('Resubmit') ? 'Resubmission' : 'Approval',
          docIds: [], responseDue: addDays(h.ts, 14), status: 'Pending Response',
        });
      }
      transMap.get(h.transmittal).docIds.push({ docId: doc.id, rev: h.rev });
    }
  }
}
for (const doc of DOCUMENTS) {
  for (const h of doc.history) {
    if (h.event === 'Customer review' && h.to === 'Approved') {
      // mark the most recent transmittal for this doc responded
      const tIds = [...transMap.values()].filter(t => t.projectId === doc.projectId && t.docIds.some(d => d.docId === doc.id));
      for (const t of tIds) if (h.ts > t.sentDate) { t.status = 'Response Received'; t.responseDate = h.ts; }

function isOverdue(ts) { return ts !== null && ts !== undefined && ts < NOW; }
function daysUntil(ts) { return Math.round((ts - NOW) / DAY); }

function computeKPIs() {
  const activeProjects = PROJECTS.filter(p => p.status === 'Active').length;
  const cpoValue = CUSTOMER_POS.reduce((s, p) => s + p.value, 0);
  const ppoValue = PROCUREMENT_POS.reduce((s, p) => s + p.value, 0);
  const equipInProduction = EQUIPMENT.filter(e => e.currentStageIdx > 0 && e.currentStageIdx < 21 && e.dispatchStatus !== 'Delivered').length;
  const docsAwaiting = DOCUMENTS.filter(d => ['Internal Review', 'Submitted'].includes(d.status)).length;
  const overdueDocs = DOCUMENTS.filter(d => !['Approved'].includes(d.status) && isOverdue(d.dueDate)).length;
  const overdueSupplier = PROCUREMENT_POS.filter(p => p.status !== 'Closed' && p.status !== 'Material Release' && isOverdue(p.revisedPromisedDate || p.promisedDate)).length;
  const materialShortages = PROCUREMENT_POS.filter(p => p.qtyBalance > 0 && p.status !== 'Closed').length;
  const milestonesPlanned = PROJECTS.length * 4;
  const milestonesActual = PROJECTS.reduce((s, p) => s + projectMilestones(p).filter(m => m.done).length, 0);
  const inspectionsAwaiting = 0; // all generated inspections already have a recorded result in this demo
  const finalInspections = INSPECTIONS.filter(i => i.type === 'Final Inspection');
  const firstTimeAccept = finalInspections.length ? Math.round(100 * finalInspections.filter(i => i.result === 'Pass').length / finalInspections.length) : null;
  const openNcrs = NCRS.filter(n => n.status !== 'Closed').length;
  const awaitingRelease = EQUIPMENT.filter(e => e.dispatchStatus === 'Ready for Dispatch').length;
  const readyDispatch = EQUIPMENT.filter(e => e.dispatchStatus === 'Ready for Dispatch').length;
  const overdueMilestones = PROJECTS.filter(p => p.status !== 'Closed' && isOverdue(p.contractEnd)).length;
  const blockedEquip = EQUIPMENT.filter(e => e.stages.some(s => s.status === 'blocked'));

  return {
    activeProjects, cpoValue, ppoValue, equipInProduction, docsAwaiting, overdueDocs, overdueSupplier,
    materialShortages, milestonesPlanned, milestonesActual, firstTimeAccept, openNcrs, awaitingRelease,
    readyDispatch, overdueMilestones, blockedEquip,
  };
}

function projectMilestones(p) {
  const eqs = EQUIPMENT.filter(e => e.projectId === p.id);
  const docs = DOCUMENTS.filter(d => d.projectId === p.id);
  const engDone = docs.filter(d => d.type === 'Engineering Drawing').every(d => d.status === 'Approved') && docs.some(d => d.type === 'Engineering Drawing');
  const matDone = eqs.length > 0 && eqs.every(e => e.currentStageIdx >= 7 || e.stages[7].status === 'done');
  const fabDone = eqs.length > 0 && eqs.every(e => e.stages[10].status === 'done' || e.currentStageIdx > 10);
  const dispatchDone = eqs.length > 0 && eqs.every(e => e.dispatchStatus === 'Dispatched' || e.dispatchStatus === 'Delivered');
  return [
    { name: 'Engineering Complete', done: !!engDone, planned: addDays(p.start, 60) },
    { name: 'Material Procurement Complete', done: !!matDone, planned: addDays(p.start, 120) },
    { name: 'Fabrication Complete', done: !!fabDone, planned: addDays(p.start, 220) },
    { name: 'Dispatch Complete', done: !!dispatchDone, planned: p.contractEnd },
  ];
}

function projectProgress(p) {
  const eqs = EQUIPMENT.filter(e => e.projectId === p.id);
  if (!eqs.length) return 0;
  const sum = eqs.reduce((s, e) => s + (e.currentStageIdx / 21), 0);
  return Math.round(100 * sum / eqs.length);
}

function computeNotifications() {
  const out = [];
  const push = (sev, cat, text, ts, nav) => out.push({ sev, cat, text, ts, nav });

  for (const d of DOCUMENTS) {
    if (d.status !== 'Approved' && isOverdue(d.dueDate)) {
      push('critical', 'Document overdue', `${d.docNumber} (${d.type}) is overdue for ${d.status === 'Internal Review' ? 'internal review' : d.status === 'Revise & Resubmit' ? 'resubmission' : 'customer response'} — due ${dstr(d.dueDate)}.`, d.dueDate, { view: 'document-detail', id: d.id });
    } else if (d.status !== 'Approved' && !isOverdue(d.dueDate) && daysUntil(d.dueDate) <= 7) {
      push('warning', 'Document due soon', `${d.docNumber} due ${dstr(d.dueDate)} (${daysUntil(d.dueDate)}d).`, d.dueDate, { view: 'document-detail', id: d.id });
    }
  }
  for (const p of PROCUREMENT_POS) {
    const due = p.revisedPromisedDate || p.promisedDate;
    if (p.status !== 'Closed' && p.status !== 'Material Release' && isOverdue(due)) {
      push('critical', 'Supplier delivery overdue', `${p.poNumber} (${supById[p.supplierId].name}) overdue since ${dstr(due)}.`, due, { view: 'ppo-detail', id: p.id });
    } else if (p.status !== 'Closed' && !isOverdue(due) && daysUntil(due) <= 10) {
      push('warning', 'Delivery approaching', `${p.poNumber} promised ${dstr(due)} (${daysUntil(due)}d).`, due, { view: 'ppo-detail', id: p.id });
    }
  }
  for (const n of NCRS) {
    if (n.status !== 'Closed' && isOverdue(n.targetClosure)) {
      push('critical', 'NCR overdue', `${n.id} past target closure ${dstr(n.targetClosure)}.`, n.targetClosure, { view: 'ncr-detail', id: n.id });
    }
  }
  for (const e of EQUIPMENT) {
    if (e.qualityHold) push('critical', 'Quality hold', `${e.tag} is on quality hold pending NCR disposition.`, NOW, { view: 'equipment-detail', id: e.id });
    if (e.dispatchStatus === 'Ready for Dispatch') push('info', 'Awaiting final release', `${e.tag} has quality release and is ready for dispatch.`, NOW, { view: 'equipment-detail', id: e.id });
    const blocked = e.stages.find(s => s.status === 'blocked');
    if (blocked && e.outcome !== 'ncr-hold') push('warning', 'Equipment blocked', `${e.tag} blocked at "${blocked.name}" — ${blocked.note}`, NOW, { view: 'equipment-detail', id: e.id });
  }
  for (const p of PROJECTS) {
    if (p.status !== 'Closed' && isOverdue(p.contractEnd)) {
      push('critical', 'Project milestone overdue', `${p.name} contractual completion was ${dstr(p.contractEnd)}.`, p.contractEnd, { view: 'project-detail', id: p.id });
    }
  }
  for (const m of MATERIAL_BATCHES) {
    if (m.certStatus !== 'Verified') push('warning', 'Certificate pending', `Heat ${m.heat} material certificate not yet verified.`, m.receivedDate, { view: 'material-detail', id: m.id });
  }
  out.sort((a, b) => (sevRank(a.sev) - sevRank(b.sev)) || (a.ts - b.ts));
  return out;
}
function sevRank(s) { return s === 'critical' ? 0 : s === 'warning' ? 1 : 2; }

function buildSearchIndex() {
  const idx = [];
  for (const p of PROJECTS) idx.push({ type: 'Project', id: p.id, label: p.name, sub: `${p.code} · ${custById[p.customerId].short}`, nav: { view: 'project-detail', id: p.id } });
  for (const c of CUSTOMER_POS) idx.push({ type: 'Customer PO', id: c.id, label: c.poNumber, sub: `${custById[c.customerId].name}`, nav: { view: 'cpo-detail', id: c.id } });
  for (const p of PROCUREMENT_POS) idx.push({ type: 'Procurement PO', id: p.id, label: p.poNumber, sub: `${supById[p.supplierId].name} — ${p.description}`, nav: { view: 'ppo-detail', id: p.id } });
  for (const e of EQUIPMENT) idx.push({ type: 'Equipment', id: e.id, label: e.tag, sub: `${e.serial} — ${e.desc}`, nav: { view: 'equipment-detail', id: e.id } });
  for (const d of DOCUMENTS) idx.push({ type: 'Document', id: d.id, label: d.docNumber, sub: `${d.title} (Rev ${d.revision})`, nav: { view: 'document-detail', id: d.id } });
  for (const t of TRANSMITTALS) idx.push({ type: 'Transmittal', id: t.id, label: t.id, sub: `${t.recipient} — ${t.purpose}`, nav: { view: 'transmittal-detail', id: t.id } });
  for (const m of MATERIAL_BATCHES) idx.push({ type: 'Material Batch', id: m.id, label: `Heat ${m.heat}`, sub: `${m.grade} — Batch ${m.batchNo}`, nav: { view: 'material-detail', id: m.id } });
  for (const i of INSPECTIONS) idx.push({ type: 'Inspection', id: i.id, label: i.id, sub: `${i.type} — ${EQUIPMENT_BY_ID[i.equipmentId].tag}`, nav: { view: 'inspection-detail', id: i.id } });
  for (const n of NCRS) idx.push({ type: 'NCR', id: n.id, label: n.id, sub: `${EQUIPMENT_BY_ID[n.equipmentId].tag} — ${n.severity}`, nav: { view: 'ncr-detail', id: n.id } });
  for (const d of DISPATCH_RECORDS) idx.push({ type: 'Dispatch', id: d.id, label: d.id, sub: `${EQUIPMENT_BY_ID[d.equipmentId].tag} — ${d.deliveryRef}`, nav: { view: 'dispatch-detail', id: d.id } });
  for (const s of SUPPLIERS) idx.push({ type: 'Supplier', id: s.id, label: s.name, sub: 'Supplier — view procurement POs', nav: { view: 'ppo-list' } });
  return idx;
}

function searchEntities(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const idx = SEARCH_INDEX;
  return idx.filter(it => it.id.toLowerCase().includes(q) || it.label.toLowerCase().includes(q) || it.sub.toLowerCase().includes(q)).slice(0, 60);
}

// ---------- chart data builders ----------
function chartProductionByProject() {
  return PROJECTS.map(p => ({ label: p.code, value: projectProgress(p) }));
}
function chartPoDeliveryPerformance() {
  const relevant = PROCUREMENT_POS;
  const onTime = relevant.filter(p => p.actualDeliveryDate && p.actualDeliveryDate <= (p.revisedPromisedDate || p.promisedDate)).length;
  const late = relevant.filter(p => (p.actualDeliveryDate && p.actualDeliveryDate > (p.revisedPromisedDate || p.promisedDate)) || (!p.actualDeliveryDate && isOverdue(p.revisedPromisedDate || p.promisedDate))).length;
  const pending = relevant.length - onTime - late;
  return [{ label: 'On Time', value: onTime }, { label: 'Late', value: late }, { label: 'Pending', value: pending }];
}
function chartDocTurnaround() {
  const buckets = { 'Drawings': [], 'Certificates': [], 'Inspection Reports': [], 'Procedures': [] };
  const map = { 'Engineering Drawing': 'Drawings', 'General Arrangement Drawing': 'Drawings', 'Fabrication Drawing': 'Drawings',
    'Material Test Certificate': 'Certificates', 'Certificate of Conformity': 'Certificates',
    'Inspection Report': 'Inspection Reports', 'NDT Report': 'Inspection Reports', 'Dimensional Inspection Report': 'Inspection Reports',
    'Welding Procedure Specification': 'Procedures', 'Procedure Qualification Record': 'Procedures' };
  for (const d of DOCUMENTS) {
    const b = map[d.type]; if (!b) continue;
    const submit = d.history.find(h => h.event.includes('Submitted'));
    const approve = d.history.find(h => h.to === 'Approved');
    if (submit && approve) buckets[b].push((approve.ts - submit.ts) / DAY);
  }
  return Object.entries(buckets).map(([label, arr]) => ({ label, value: arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0 }));
}
function chartStageDistribution() {
  const phases = ['Planning & Engineering', 'Material', 'Fabrication', 'Testing & QA', 'Completion & Dispatch'];
  const counts = Object.fromEntries(phases.map(p => [p, 0]));
  for (const e of EQUIPMENT) counts[STAGE_PHASE(e.currentStageIdx)]++;
  return phases.map(label => ({ label, value: counts[label] }));
}
function chartMilestonesPlannedVsActual() {
  return PROJECTS.map(p => {
    const ms = projectMilestones(p);
    return { label: p.code, planned: ms.length, actual: ms.filter(m => m.done).length };
  });
}
function chartIssuesByDept() {
  const depts = {};
  for (const n of NCRS.filter(n => n.status !== 'Closed')) depts[n.dept] = (depts[n.dept] || 0) + 1;
  for (const e of EQUIPMENT) {
    const b = e.stages.find(s => s.status === 'blocked');
    if (b) { const d = STAGE_PHASE(b.idx) === 'Material' ? 'Procurement' : 'Production'; depts[d] = (depts[d] || 0) + 1; }
  }
  return Object.entries(depts).map(([label, value]) => ({ label, value }));
}
function chartQualityTrend() {
  const earliest = Math.min(...PROJECTS.map(p => p.start));
  const startD = new Date(earliest);
  const monthsSpan = (new Date(NOW).getUTCFullYear() - startD.getUTCFullYear()) * 12 + (new Date(NOW).getUTCMonth() - startD.getUTCMonth());
  const months = [];
  for (let i = monthsSpan; i >= 0; i--) { const d = new Date(NOW); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - i); months.push(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); }
  const opened = months.map(m => NCRS.filter(n => monthKey(n.detectDate) === monthKey(m)).length);
  const closed = months.map(m => NCRS.filter(n => n.actualClosure && monthKey(n.actualClosure) === monthKey(m)).length);
  return { labels: months.map(monthLabel), opened, closed };
}

// ---------- dossier completeness ----------
function dossierCompleteness(eq) {
  const docs = DOCUMENTS.filter(d => d.equipmentId === eq.id);
  const have = new Set(docs.filter(d => d.status === 'Approved').map(d => d.type));
  const items = DOSSIER_REQUIREMENTS.map(req => ({ req, present: have.has(req) }));
  const pct = Math.round(100 * items.filter(i => i.present).length / items.length);
  return { items, pct };
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function fmtInt(n) { return Number(n).toLocaleString('en-US'); }

// ---------- table component ----------
// columns: [{key, label, align, render(row), sortable, sortVal(row)}]
function renderTable(columns, rows, opts) {
  opts = opts || {};
  if (!rows.length) return `<div class="table-wrap card"><div class="table-empty">${escapeHtml(opts.emptyText || 'No records match the current filter.')}</div></div>`;
  const sortKey = opts.sortKey, sortDir = opts.sortDir || 'asc';
  const thead = columns.map(c => {
    const sortable = c.sortable ? ' sortable' : '';
    const active = sortKey === c.key ? ` (${sortDir === 'asc' ? '↑' : '↓'})` : '';
    const attrs = c.sortable ? ` data-sort-key="${c.key}"` : '';
    return `<th class="${sortable}" style="${c.align ? `text-align:${c.align}` : ''}"${attrs}>${escapeHtml(c.label)}${active}</th>`;
  }).join('');
  const tbody = rows.map(row => {
    const navAttrs = opts.rowNav ? nav(opts.rowNav(row).view, opts.rowNav(row).id, opts.rowNav(row).extra) : '';
    const cls = opts.rowNav ? 'clickable' : '';
    const tds = columns.map(c => `<td style="${c.align ? `text-align:${c.align}` : ''}">${c.render(row)}</td>`).join('');
    return `<tr class="${cls}" ${navAttrs}>${tds}</tr>`;
  }).join('');
  return `<div class="table-wrap card"><table class="dtable" ${opts.tableId ? `data-table-id="${opts.tableId}"` : ''}><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}
function sortRows(rows, key, dir, valueFn) {
  const sorted = rows.slice().sort((a, b) => {
    const va = valueFn(a, key), vb = valueFn(b, key);
    if (va == null && vb == null) return 0;
    if (va == null) return 1; if (vb == null) return -1;
    if (typeof va === 'string') return va.localeCompare(vb);
    return va - vb;
  });
  if (dir === 'desc') sorted.reverse();
  return sorted;
}

// ---------- SVG charts ----------
function svgEl(w, h, inner) { return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMinYMin meet">${inner}</svg>`; }
function hBarChart(data, opts) {
  opts = opts || {};
  const w = 520, barH = 22, gap = 12, left = opts.leftPad || 150, right = 50, top = 8;
  const max = opts.max || Math.max(1, ...data.map(d => d.value));
  const h = top + data.length * (barH + gap);
  let rows = '';
  data.forEach((d, i) => {
    const y = top + i * (barH + gap);
    const bw = Math.max(2, (w - left - right) * (d.value / max));
    rows += `<text x="${left - 8}" y="${y + barH / 2 + 4}" font-size="11" text-anchor="end">${escapeHtml(d.label)}</text>`;
    rows += `<rect x="${left}" y="${y}" width="${w - left - right}" height="${barH}" fill="var(--surface-2)" rx="4"></rect>`;
    rows += `<rect x="${left}" y="${y}" width="${bw}" height="${barH}" class="barfill" rx="4"></rect>`;
    rows += `<text x="${left + bw + 8}" y="${y + barH / 2 + 4}" font-size="11" class="valuelabel">${opts.fmt ? opts.fmt(d.value) : d.value}</text>`;
  });
  return svgEl(w, h, rows);
}
function hGroupedBarChart(data, opts) {
  opts = opts || {};
  const w = 540, barH = 9, gap = 20, left = opts.leftPad || 150, right = 56, top = 10;
  const max = Math.max(1, ...data.map(d => Math.max(d.planned, d.actual)));
  const h = top + data.length * (barH * 2 + gap);
  let rows = '';
  data.forEach((d, i) => {
    const y = top + i * (barH * 2 + gap);
    const bw1 = Math.max(2, (w - left - right) * (d.planned / max));
    const bw2 = Math.max(2, (w - left - right) * (d.actual / max));
    rows += `<text x="${left - 8}" y="${y + barH + 3}" font-size="11" text-anchor="end">${escapeHtml(d.label)}</text>`;
    rows += `<rect x="${left}" y="${y}" width="${bw1}" height="${barH}" fill="var(--border)" rx="3"></rect>`;
    rows += `<text x="${left + bw1 + 6}" y="${y + barH}" font-size="9.5" class="valuelabel">${d.planned}</text>`;
    rows += `<rect x="${left}" y="${y + barH + 3}" width="${bw2}" height="${barH}" class="barfill" rx="3"></rect>`;
    rows += `<text x="${left + bw2 + 6}" y="${y + barH * 2 + 3}" font-size="9.5" class="valuelabel">${d.actual}</text>`;
  });
  rows += `<g transform="translate(${left},${h - 2})">
    <rect x="0" y="0" width="10" height="8" fill="var(--border)" rx="2"></rect><text x="14" y="7" font-size="9.5">Planned</text>
    <rect x="70" y="0" width="10" height="8" class="barfill" rx="2"></rect><text x="84" y="7" font-size="9.5">Actual</text>
  </g>`;
  return svgEl(w, h + 14, rows);
}
function donutChart(data, opts) {
  opts = opts || {};
  const size = 190, r = 70, cx = 95, cy = 95, strokeW = 26;
  const total = Math.max(1, data.reduce((s, d) => s + d.value, 0));
  const colors = ['var(--accent)', 'var(--hold)', 'var(--info)', 'var(--warn)', 'var(--good)', 'var(--bad)'];
  let acc = 0, segs = '';
  const circ = 2 * Math.PI * r;
  data.forEach((d, i) => {
    const frac = d.value / total;
    const dash = frac * circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="${strokeW}" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    acc += dash;
  });
  const legend = data.map((d, i) => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px"><span style="width:9px;height:9px;border-radius:2px;background:${colors[i % colors.length]};flex:none"></span>${escapeHtml(d.label)} <span class="mono" style="color:var(--faint);margin-left:auto">${d.value}</span></div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 ${size} ${size}" width="150" height="150">${segs}<circle cx="${cx}" cy="${cy}" r="${r - strokeW / 2 - 2}" fill="var(--surface)"></circle><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--ink)" font-family="var(--font-display)">${total}</text></svg>
    <div style="flex:1;min-width:120px">${legend}</div>
  </div>`;
}
function lineChart(labels, series, opts) {
  opts = opts || {};
  const w = 560, h = 160, left = 30, right = 14, top = 12, bottom = 26;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const innerW = w - left - right, innerH = h - top - bottom;
  const n = labels.length;
  const x = i => left + (n <= 1 ? 0 : innerW * i / (n - 1));
  const y = v => top + innerH - innerH * (v / max);
  const colors = ['var(--accent)', 'var(--bad)'];
  let grid = '';
  for (let gy = 0; gy <= 4; gy++) { const yy = top + innerH * gy / 4; grid += `<line x1="${left}" y1="${yy}" x2="${w - right}" y2="${yy}" class="gridline"></line>`; }
  let paths = series.map((s, si) => {
    const d = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const dots = s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="${colors[si % colors.length]}"></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${colors[si % colors.length]}" stroke-width="2"></path>${dots}`;
  }).join('');
  const stepLabel = Math.ceil(n / 9);
  let xlabels = '';
  for (let i = 0; i < n; i += stepLabel) xlabels += `<text x="${x(i).toFixed(1)}" y="${h - 6}" font-size="9" text-anchor="middle">${escapeHtml(labels[i])}</text>`;
  const legend = series.map((s, i) => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:10.5px"><span style="width:8px;height:8px;border-radius:50%;background:${colors[i % colors.length]}"></span>${escapeHtml(s.name)}</span>`).join('');
  return `<div>${svgEl(w, h, grid + paths + xlabels)}<div style="margin-top:4px">${legend}</div></div>`;
}

// ---------- equipment stage timeline ----------
function stageDotIcon(status) {
  if (status === 'done') return icon('check');
  if (status === 'blocked') return icon('x');
  if (status === 'skipped') return icon('chevron');
  if (status === 'current') return '';
  return '';
}
function renderStageTimeline(eq) {
  const items = eq.stages.map(s => {
    const cls = s.status;
    const when = s.status === 'done' ? dstr(s.date) : s.status === 'blocked' ? 'In progress — blocked' : s.status === 'skipped' ? 'Skipped' : s.status === 'current' ? 'In progress' : 'Pending';
    const note = s.note ? `<div class="tl-note ${s.status === 'blocked' ? 'warn-note' : ''}">${escapeHtml(s.note)}</div>` : '';
    const actor = s.actor && (s.status === 'done' || s.status === 'blocked' || s.status === 'skipped') ? `<div class="tl-actor">${s.status === 'blocked' ? 'Flagged by' : s.status === 'skipped' ? 'Recorded by' : 'Completed by'} ${escapeHtml(userName(s.actor))}</div>` : '';
    return `<div class="tl-item ${cls}">
      <div class="tl-dot">${stageDotIcon(s.status)}</div>
      <div class="tl-head"><span class="tl-name">${s.idx + 1}. ${escapeHtml(s.name)}</span><span class="tl-when">${when}</span></div>
      ${note}${actor}
    </div>`;
  }).join('');
  return `<div class="timeline">${items}</div>`;
}

// ---------- document revision history timeline ----------
function renderDocHistory(doc) {
  const items = doc.history.map(h => {
    const isNeg = h.to === 'Revise & Resubmit' || h.to === 'Rejected';
    return `<div class="tl-item done">
      <div class="tl-dot" style="${isNeg ? 'border-color:var(--bad);color:var(--bad);background:var(--bad-weak)' : ''}">${isNeg ? icon('alert') : icon('check')}</div>
      <div class="tl-head"><span class="tl-name">${escapeHtml(h.event)} ${h.rev ? `<span class="mono" style="color:var(--faint);font-weight:500">Rev ${h.rev}</span>` : ''}</span><span class="tl-when">${dtstr(h.ts)}</span></div>
      ${h.comment ? `<div class="tl-note ${isNeg ? 'warn-note' : ''}">${escapeHtml(h.comment)}</div>` : ''}
      ${h.transmittal ? `<div class="tl-actor">Via transmittal <span class="link mono" ${nav('transmittal-detail', h.transmittal)}>${h.transmittal}</span></div>` : ''}
      <div class="tl-actor">${escapeHtml(userName(h.actor))}${h.from ? ` · ${escapeHtml(h.from)} → ${escapeHtml(h.to)}` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="timeline">${items}</div>`;
}

// ---------- QR placeholder ----------
function renderQr(eq) {
  const cells = qrPattern(eq.id + eq.tag);
  const cell = 9, pad = 10, size = 11 * cell + pad * 2;
  let rects = '';
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    if (cells[y * 11 + x]) rects += `<rect x="${pad + x * cell}" y="${pad + y * cell}" width="${cell}" height="${cell}" fill="var(--ink)"></rect>`;
  }
  return `<div class="qr-box card">
    <svg width="132" height="132" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="var(--surface)"></rect>${rects}</svg>
    <div class="qr-id">${eq.id}</div>
    <div class="qr-cap">Demo traceability code — illustrative only, not scannable.<br>In production this resolves to this item's full traceability page.</div>
  </div>`;
}

  const cpos = CUSTOMER_POS.filter(c => c.projectId === proj.id);

  const html = [];

  function tabCount(k) {
    return { overview: null, pos: cpos.length + ppos.length, documents: docs.length, materials: mats.length,
      production: eqs.length, quality: insps.length + ncrs.length, issues: blocked.length + ncrs.filter(n => n.status !== 'Closed').length,
      deliveries: disps.length, audit: null }[k];
  }

  if (tab === 'overview') {
    html.push(`<div class="detail-grid">
      <div>
        <div class="card card-pad">
          <div class="subhead">Project details</div>
          <div class="kv-list">
            <div class="kv-row"><span class="k">Customer</span><span class="v">${escapeHtml(custById[proj.customerId].name)}</span></div>

          </div>
        </div>
        <div class="section-title">Milestones</div>
        <div class="card card-pad">${projectMilestones(proj).map(m => `<div class="doclist-row" style="cursor:default"><div class="main"><div class="t">${m.done ? icon('check', 'mono') : ''} ${escapeHtml(m.name)}</div><div class="s">Baseline ${dstr(m.planned)}</div></div>${badge(m.done ? 'Complete' : 'In Progress', m.done ? 'good' : 'warn')}</div>`).join('')}</div>

      <div>
        <div class="card card-pad">
          <div class="subhead">Scope at a glance</div>
          <div class="kv-list">
            <div class="kv-row"><span class="k">Customer POs</span><span class="v">${cpos.length}</span></div>
            <div class="kv-row"><span class="k">Procurement POs</span><span class="v">${ppos.length}</span></div>
            <div class="kv-row"><span class="k">Equipment items</span><span class="v">${eqs.length}</span></div>
            <div class="kv-row"><span class="k">Documents</span><span class="v">${docs.length}</span></div>
            <div class="kv-row"><span class="k">Open NCRs</span><span class="v">${ncrs.filter(n => n.status !== 'Closed').length}</span></div>

          <div style="display:flex;align-items:center;gap:10px"><span class="progress-bar" style="flex:1"><i style="width:${projectProgress(proj)}%"></i></span><span class="mono" style="font-weight:700">${projectProgress(proj)}%</span></div>
          <div style="font-size:11px;color:var(--faint);margin-top:6px">Average of each equipment item's current stage ÷ 22 stages.</div>
        </div>
      </div>
    </div>`);
  } else if (tab === 'pos') {
    html.push(sectionTitle('Customer purchase orders'));
    html.push(renderTable([
      { key: 'po', label: 'PO Number', render: r => `<span class="mono">${escapeHtml(r.poNumber)}</span>` },
      { key: 'val', label: 'Value', align: 'right', render: r => fmtMoney(r.value, r.currency) },

      { key: 'status', label: 'Status', render: r => cpoStatusBadge(r.status) },
      { key: 'due', label: 'Contract Delivery', align: 'right', render: r => `<span class="mono">${dstr(r.contractDeliveryDate)}</span>` },
    ], cpos, { rowNav: r => ({ view: 'cpo-detail', id: r.id }) }));
    html.push(sectionTitle('Internal procurement purchase orders'));
    html.push(renderTable([
      { key: 'po', label: 'PO Number', render: r => `<span class="mono">${escapeHtml(r.poNumber)}</span>` },
      { key: 'supplier', label: 'Supplier', render: r => escapeHtml(supById[r.supplierId].name) },
      { key: 'desc', label: 'Description', render: r => escapeHtml(r.description) },
      { key: 'val', label: 'Value', align: 'right', render: r => fmtMoney(r.value, r.currency) },
      { key: 'status', label: 'Status', render: r => ppoStatusBadge(r.status) },
    ], ppos, { rowNav: r => ({ view: 'ppo-detail', id: r.id }) }));
  } else if (tab === 'documents') {
    html.push(renderTable(docColumns(), docs, { rowNav: r => ({ view: 'document-detail', id: r.id }) }));
  } else if (tab === 'materials') {
    html.push(renderTable(materialColumns(), mats, { rowNav: r => ({ view: 'material-detail', id: r.id }) }));
  } else if (tab === 'production') {
    html.push(renderTable(equipmentColumns(), eqs, { rowNav: r => ({ view: 'equipment-detail', id: r.id }) }));
  } else if (tab === 'quality') {
    html.push(sectionTitle('Inspections'));
    html.push(renderTable(inspectionColumns(), insps, { rowNav: r => ({ view: 'inspection-detail', id: r.id }) }));
    html.push(sectionTitle('Non-conformance reports'));
    html.push(renderTable(ncrColumns(), ncrs, { rowNav: r => ({ view: 'ncr-detail', id: r.id }) }));
  } else if (tab === 'issues') {
    html.push(sectionTitle('Blocked equipment'));
    if (!blocked.length) html.push(emptyInline('Nothing blocked on this project right now.'));
    else html.push(`<div class="statusgrid">` + blocked.map(e => {
      const b = e.stages.find(s => s.status === 'blocked');

    }).join('') + `</div>`);

    html.push(renderTable(ncrColumns(), ncrs.filter(n => n.status !== 'Closed'), { rowNav: r => ({ view: 'ncr-detail', id: r.id }) }));
  } else if (tab === 'deliveries') {
    html.push(renderTable(dispatchColumns(), disps, { rowNav: r => ({ view: 'dispatch-detail', id: r.id }) }));

  return html.join('');
}

function lifecycleStepper(steps, current) {
  const idx = steps.indexOf(current);
  return `<div class="stepper card card-pad">${steps.map((s, i) => `<div class="step ${i < idx ? 'done' : i === idx ? 'now' : ''}"><span class="sdot"></span>${escapeHtml(s)}</div>`).join('')}</div>`;

function viewTraceability(p) {
  const eq = EQUIPMENT_BY_ID[p.id];

  const ncr = eq.ncrId ? NCR_BY_ID[eq.ncrId] : null;
  const disp = DISPATCH_RECORDS.find(d => d.equipmentId === eq.id);

    { label: `Material Batches (${mats.length})`, cards: mats.map(m => cardFor(`Heat ${m.heat}`, m.certStatus, { view: 'material-detail', id: m.id })) },
    { label: 'Manufacturing Operations', cards: [cardFor(`Stage ${eq.currentStageIdx + 1} of 22`, STAGE_DEFS[eq.currentStageIdx], { view: 'equipment-detail', id: eq.id, extra: { tab: 'timeline' } })] },
    { label: `Inspection Records (${insps.length})`, cards: insps.map(i => cardFor(i.id, `${i.type} — ${i.result}`, { view: 'inspection-detail', id: i.id })) },
    { label: ncr ? 'NCR' : 'NCR', cards: ncr ? [cardFor(ncr.id, ncr.status, { view: 'ncr-detail', id: ncr.id })] : [cardFor('None raised', 'No quality non-conformance on this item', null)] },
    { label: 'Manufacturing Dossier', cards: [cardFor(`${dossier.pct}% complete`, dossier.pct === 100 ? 'Ready for handover' : 'Documents still missing', { view: 'equipment-detail', id: eq.id, extra: { tab: 'dossier' } })] },
    { label: 'Dispatch & Delivery', cards: [disp ? cardFor(disp.deliveryRef, disp.status, { view: 'dispatch-detail', id: disp.id }) : cardFor(eq.dispatchStatus, 'Not yet dispatched', null)] },
  ];
  function cardFor(t, s, target) {
    return `<div class="chain-card" ${target ? nav(target.view, target.id, target.extra) : ''} style="${target ? '' : 'cursor:default;color:var(--faint)'}"><div class="cc-t">${escapeHtml(t)}</div><div class="cc-s">${escapeHtml(s)}</div></div>`;
  }
  const html = [];
  html.push(pageHead('Traceability Chain', `Full forward chain for ${escapeHtml(eq.tag)} — project through to dispatch. Any document, material or inspection can also be traced back to this equipment item from its own record.`));
  html.push(`<div class="chain">${rows.map((r, i) => `<div class="chain-row"><div class="chain-rail"><span class="cdot"></span>${i < rows.length - 1 ? '<span class="cline"></span>' : ''}</div><div class="chain-body"><div class="chain-label">${escapeHtml(r.label)}</div><div class="chain-cards">${r.cards.join('')}</div></div></div>`).join('')}</div>`);
  return html.join('');
}

function sidebarCount(view) {
  if (view === 'documents-list') return DOCUMENTS.filter(d => d.status !== 'Approved' && isOverdue(d.dueDate)).length;
  if (view === 'ncr-list') return NCRS.filter(n => n.status !== 'Closed').length;
  if (view === 'ppo-list') return PROCUREMENT_POS.filter(p => p.status !== 'Closed' && p.status !== 'Material Release' && isOverdue(p.revisedPromisedDate || p.promisedDate)).length;
  if (view === 'notifications-list') return computeNotifications().length;
  return 0;
}

function titleFor(view, params) {
  params = params || {};
  switch (view) {
    case 'dashboard': return 'Dashboard';
    case 'projects-list': return 'Projects';
    case 'project-detail': return projById[params.id] ? projById[params.id].code : 'Project';
    case 'cpo-list': return 'Customer POs';
    case 'cpo-detail': return CPO_BY_ID[params.id] ? CPO_BY_ID[params.id].poNumber : 'PO';
    case 'ppo-list': return 'Procurement POs';
    case 'ppo-detail': return PPO_BY_ID[params.id] ? PPO_BY_ID[params.id].poNumber : 'PO';
    case 'documents-list': return 'Documents';
    case 'document-detail': return DOC_BY_ID[params.id] ? DOC_BY_ID[params.id].docNumber : 'Document';
    case 'transmittals-list': return 'Transmittals';
    case 'transmittal-detail': return params.id || 'Transmittal';
    case 'materials-list': return 'Materials';
    case 'material-detail': return MAT_BY_ID[params.id] ? `Heat ${MAT_BY_ID[params.id].heat}` : 'Material';
    case 'equipment-list': return 'Manufacturing Tracker';
    case 'equipment-detail': return EQUIPMENT_BY_ID[params.id] ? EQUIPMENT_BY_ID[params.id].tag : 'Equipment';
    case 'inspections-list': return 'Inspections';
    case 'inspection-detail': return params.id || 'Inspection';
    case 'ncr-list': return 'NCRs';
    case 'ncr-detail': return params.id || 'NCR';
    case 'dispatch-list': return 'Dispatch';
    case 'dispatch-detail': return params.id || 'Dispatch';
    case 'reports-list': return 'Reports';
    case 'notifications-list': return 'Notifications';
    case 'admin': return 'Admin';

    case 'traceability': return EQUIPMENT_BY_ID[params.id] ? `Traceability — ${EQUIPMENT_BY_ID[params.id].tag}` : 'Traceability';
    default: return view;
  }
}

// ---------------------------------------------------------------- nav state
let navStack = [{ view: 'dashboard', params: {}, title: 'Dashboard' }];

function navigate(view, id, extra) {
  const params = Object.assign({}, id != null ? { id } : {}, extra || {});
  navStack.push({ view, params, title: titleFor(view, params) });
  render();
}
function navigateModule(view) {
  navStack = [{ view, params: {}, title: titleFor(view, {}) }];
  render();
}
function goToCrumb(i) {
  navStack = navStack.slice(0, i + 1);
  render();
}
function updateTopParams(patch) {
  const top = navStack[navStack.length - 1];
  Object.keys(patch).forEach(k => {
    if (patch[k] === undefined || patch[k] === '') delete top.params[k];
    else top.params[k] = patch[k];
  });
  top.title = titleFor(top.view, top.params);
  render();
}

// ---------------------------------------------------------------- render
function render() {
  const top = navStack[navStack.length - 1];
  const def = VIEWS[top.view];
  let html;
  try {
    html = def ? def.render(top.params) : emptyState('Page not found', `No view is registered for "${top.view}".`);
  } catch (err) {
    html = emptyState('Something went wrong rendering this page', (err && err.message) ? err.message : String(err));
  }
  const vp = document.getElementById('viewport');
  vp.innerHTML = html;
  vp.scrollTop = 0;
  document.getElementById('breadcrumb').innerHTML = renderBreadcrumb();
  const moduleKey = navStack[0].view;
  document.querySelectorAll('#sidebarnav .navitem').forEach(el => el.classList.toggle('active', el.getAttribute('data-sidebar') === moduleKey));
  refreshNotifBadge();
}

function refreshNotifBadge() {
  const n = computeNotifications().length;
  const dot = document.getElementById('notifdot');
  if (!dot) return;
  if (n > 0) { dot.hidden = false; dot.textContent = n > 99 ? '99+' : String(n); }
  else dot.hidden = true;
}
