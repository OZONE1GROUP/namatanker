# Served by the frontend Docker image (see Dockerfile). Mirrors what
# Vite's dev-server proxy does locally: serve the SPA, forward /api to the
# backend container, and for the live-telemetry SSE stream specifically,
# disable response buffering so events reach the browser as they're sent
# rather than batched up by nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/stream/live {
        proxy_pass http://backend:8000/api/stream/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
